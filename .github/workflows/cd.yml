name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Escolha o ambiente para deploy'
        type: choice
        required: true        
        options:
          - dev
          - stg
          - prd

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - id: build
        name: Build da aplicação
        run: |
          docker build -t image .

      - id: integration_test
        name: Teste integrado
        run: |
          docker run image echo "Teste integrado"

  push-and-release:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    needs: build
    steps:
      - name: Verificar tag e executar
        run: |
          if [[ ! "${GITHUB_REF#refs/tags/}" =~ ^v ]]; then
            echo "Tag não selecionada. Abortando o workflow."
            exit 1
          fi
        
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Definir variáveis de ambiente
        run: |
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV          


      - name: Deploy
        run: |
          echo "Fazendo deploy para  ${{ github.event.inputs.environment }}"
          echo $GIT_TAG

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: $GIT_TAG
          name: Release $GIT_TAG ${{ github.event.inputs.environment }}
          body: "Descrição automática da release baseada na tag."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}          


